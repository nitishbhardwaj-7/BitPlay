name: iOS Build (IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Release
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: btc-mining-frontend-testing/btc-mining-frontend-testing/package-lock.json

      - name: Install JS dependencies
        working-directory: btc-mining-frontend-testing/btc-mining-frontend-testing
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        working-directory: btc-mining-frontend-testing/btc-mining-frontend-testing/ios
        run: pod install --repo-update

      - name: Patch source files for Xcode 26 compatibility
        working-directory: btc-mining-frontend-testing/btc-mining-frontend-testing
        run: |
          # Disable consteval in fmt (Clang 17 C++20 breaking change)
          FMT_FILE="ios/Pods/fmt/include/fmt/format-inl.h"
          if [ -f "$FMT_FILE" ]; then
            sed -i '' 's/FMT_USE_CONSTEVAL/0 \&\& FMT_USE_CONSTEVAL/g' "$FMT_FILE" || true
          fi
          FMT_HEADER="ios/Pods/Headers/Public/fmt/format.h"
          if [ -f "$FMT_HEADER" ]; then
            sed -i '' 's/#define FMT_USE_CONSTEVAL 1/#define FMT_USE_CONSTEVAL 0/' "$FMT_HEADER" || true
          fi
          # Fix MMKVCore memset_s on iOS 26 SDK
          MMKV_FILE="ios/Pods/MMKVCore/Core/aes/AESCrypt.cpp"
          if [ -f "$MMKV_FILE" ]; then
            sed -i '' 's/(void)memset_s(ptr, len, 0, len);/{ volatile uint8_t *vp = (volatile uint8_t*)ptr; for(size_t _i=0;_i<(size_t)len;_i++) vp[_i]=0; }/' "$MMKV_FILE" || true
          fi

      - name: Import distribution certificate and provisioning profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Distribution certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -D > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # Install provisioning profile
          PROFILE_B64="btc-mining-frontend-testing/btc-mining-frontend-testing/ios/BitPlayPro.mobileprovision.b64"
          PROFILE_PATH="$RUNNER_TEMP/BitPlayPro.mobileprovision"
          cat "$PROFILE_B64" | base64 -D -o "$PROFILE_PATH"
          echo "Profile size: $(wc -c < $PROFILE_PATH) bytes"
          if [ "$(wc -c < $PROFILE_PATH)" -lt 1000 ]; then
            echo "ERROR: Profile too small, base64 decode failed"
            exit 1
          fi
          PROFILE_UUID="a6acd01d-d401-4ace-9933-0c3d68a38d9d"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "=== Provisioning profiles installed ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        working-directory: btc-mining-frontend-testing/btc-mining-frontend-testing
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/BitPlayPro.xcworkspace \
            -scheme BitPlayPro \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/BitPlayPro.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="a6acd01d-d401-4ace-9933-0c3d68a38d9d" \
            DEVELOPMENT_TEAM=L99G6M8D7G \
            archive 2>&1 | tee $RUNNER_TEMP/xcodebuild-archive.log | xcpretty --color
          ARCHIVE_EXIT=${PIPESTATUS[0]}
          if [ "$ARCHIVE_EXIT" -ne 0 ]; then
            echo "=== ARCHIVE FAILED - last 200 lines ==="
            tail -200 $RUNNER_TEMP/xcodebuild-archive.log
            exit $ARCHIVE_EXIT
          fi
          echo "=== Archive succeeded ==="
          ls -la $RUNNER_TEMP/BitPlayPro.xcarchive

      - name: Export IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/BitPlayPro.xcarchive \
            -exportOptionsPlist btc-mining-frontend-testing/btc-mining-frontend-testing/ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa \
            2>&1 | tee $RUNNER_TEMP/xcodebuild-export.log | xcpretty --color
          EXPORT_EXIT=${PIPESTATUS[0]}
          if [ "$EXPORT_EXIT" -ne 0 ]; then
            echo "=== EXPORT FAILED - last 150 lines ==="
            tail -150 $RUNNER_TEMP/xcodebuild-export.log
            exit $EXPORT_EXIT
          fi
          echo "=== Export succeeded ==="
          ls -la $RUNNER_TEMP/ipa/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bitplay-ios-release-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
          retention-days: 7

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
