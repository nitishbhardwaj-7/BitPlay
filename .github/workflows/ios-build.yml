name: iOS Build (IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Release
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          # List available Xcode versions
          ls /Applications/ | grep Xcode || true
          # Use Xcode 16 (stable) — avoids Xcode 26 beta breaking changes
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: btc-mining-frontend-testing/btc-mining-frontend-testing/package-lock.json

      - name: Install JS dependencies
        working-directory: btc-mining-frontend-testing/btc-mining-frontend-testing
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        working-directory: btc-mining-frontend-testing/btc-mining-frontend-testing/ios
        run: pod install --repo-update

      - name: Set up App Store Connect API key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_CONTENT" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          if [ ! -s ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 ]; then
            echo "ERROR: API key file is empty — check ASC_API_KEY_CONTENT secret"
            exit 1
          fi
          echo "API key installed: $(wc -c < ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8) bytes"

      - name: Import distribution certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Archive
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        working-directory: btc-mining-frontend-testing/btc-mining-frontend-testing
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/BitPlayPro.xcworkspace \
            -scheme BitPlayPro \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/BitPlayPro.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=L99G6M8D7G \
            archive 2>&1 | tee $RUNNER_TEMP/xcodebuild-archive.log | xcpretty --color
          ARCHIVE_EXIT=${PIPESTATUS[0]}
          if [ "$ARCHIVE_EXIT" -ne 0 ]; then
            echo "=== ARCHIVE FAILED — Last 200 lines ==="
            tail -200 $RUNNER_TEMP/xcodebuild-archive.log
            exit $ARCHIVE_EXIT
          fi
          echo "=== Archive succeeded ==="
          ls -la $RUNNER_TEMP/BitPlayPro.xcarchive

      - name: Export IPA
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store-connect</string>
  <key>teamID</key>
  <string>L99G6M8D7G</string>
  <key>signingStyle</key>
  <string>automatic</string>
  <key>uploadBitcode</key>
  <false/>
  <key>compileBitcode</key>
  <false/>
  <key>uploadSymbols</key>
  <true/>
</dict>
</plist>
PLIST
          mkdir -p $RUNNER_TEMP/ipa
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/BitPlayPro.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            2>&1 | tee $RUNNER_TEMP/xcodebuild-export.log | xcpretty --color
          EXPORT_EXIT=${PIPESTATUS[0]}
          if [ "$EXPORT_EXIT" -ne 0 ]; then
            echo "=== EXPORT FAILED — Last 150 lines ==="
            tail -150 $RUNNER_TEMP/xcodebuild-export.log
            exit $EXPORT_EXIT
          fi
          echo "=== Export succeeded ==="
          ls -la $RUNNER_TEMP/ipa/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitplay-ios-release-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
          retention-days: 7

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
