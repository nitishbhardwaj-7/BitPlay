workflows:
  android-release:
    name: Android Release (AAB + APK)
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.bitplay.app"
      node: 18.18.0
      java: 17
    scripts:
      - name: Install JS dependencies
        working_directory: btc-mining-frontend-testing/btc-mining-frontend-testing
        script: npm install --legacy-peer-deps
      - name: Build Android release AAB
        working_directory: btc-mining-frontend-testing/btc-mining-frontend-testing/android
        script: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
      - name: Build Android release APK
        working_directory: btc-mining-frontend-testing/btc-mining-frontend-testing/android
        script: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - btc-mining-frontend-testing/btc-mining-frontend-testing/android/app/build/outputs/bundle/release/app-release.aab
      - btc-mining-frontend-testing/btc-mining-frontend-testing/android/app/build/outputs/apk/release/app-release.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-release:
    name: iOS Release (IPA)
    max_build_duration: 90
    environment:
      vars:
        BUNDLE_ID: "com.bitplaypro.bitplaypro"
        XCODE_WORKSPACE: btc-mining-frontend-testing/btc-mining-frontend-testing/ios/BitPlayPro.xcworkspace
        XCODE_SCHEME: BitPlayPro
      node: 18.18.0
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: CodeMagic
    scripts:
      - name: Install JS dependencies
        working_directory: btc-mining-frontend-testing/btc-mining-frontend-testing
        script: npm install --legacy-peer-deps
      - name: Install CocoaPods
        working_directory: btc-mining-frontend-testing/btc-mining-frontend-testing/ios
        script: pod install
      - name: Set up code signing
        script: |
          keychain initialize
          # Delete any stale profiles so a fresh one is created with all current capabilities
          app-store-connect profiles list \
            --bundle-identifier "$BUNDLE_ID" \
            --profile-type IOS_APP_STORE \
            --json 2>/dev/null | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    profiles = data if isinstance(data, list) else data.get('data', [])
    for p in profiles:
        pid = p.get('id') or (p.get('attributes', {}) or {}).get('uuid', '')
        if pid:
            print(pid)
except: pass
" | xargs -I {} sh -c 'app-store-connect profiles delete "{}" || true' || true
          # Fetch/create fresh signing files with all capabilities from the App ID
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
