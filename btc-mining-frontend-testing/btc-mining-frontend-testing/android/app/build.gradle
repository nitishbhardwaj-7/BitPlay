apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.bitplay.app"
    defaultConfig {
        applicationId "com.bitplay.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 257
        versionName "2.0.1"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('../../upload-keystore.jks')
            storePassword 'android'
            keyAlias 'upload'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Using release keystore for production build
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            debuggable false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

project.ext.react = [
  enableHermes: true,
]

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Firebase BoM manages versions
    implementation platform('com.google.firebase:firebase-bom:33.2.0')
    implementation 'com.google.firebase:firebase-messaging'

    // Google Sign-in
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // Google Advertising ID (required by Apptrove SDK)
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'androidx.annotation:annotation:1.6.0'

    // InMobi mediation adapter (AdMob mediation — bidding, SDK-based).
    // 10.8.3.1 was built against Google Mobile Ads SDK 24.2.0; there's no
    // adapter release built exactly for our pinned 24.6.0 (react-native-
    // google-mobile-ads), so using the nearest LOWER version rather than a
    // newer one (11.1.0.1, built for 24.9.0) — adapters are generally
    // forward-compatible with newer base SDK versions within the same major
    // line (24.x) since they call stable public APIs, but not the reverse.
    implementation('com.google.ads.mediation:inmobi:10.8.3.1') {
        // Excludes a transitive JaCoCo (code coverage) reference that broke
        // R8 minification — java.lang.instrument doesn't exist on Android
        // and this code path never actually runs at runtime.
        exclude group: 'org.jacoco'
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
