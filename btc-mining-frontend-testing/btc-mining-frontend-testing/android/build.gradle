buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")

        classpath "com.google.gms:google-services:4.4.2"
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects { p ->
    project.configurations.all {
        resolutionStrategy {
            force 'androidx.work:work-runtime:2.8.0'
            force 'androidx.work:work-runtime-ktx:2.8.0'
        }
    }
    if (p.name == 'react-native-reanimated' || p.name == 'react-native-mmkv' || p.name == 'react-native-screens') {
        p.buildDir = new File("C:/tmp/build/" + p.name)
    }
}
