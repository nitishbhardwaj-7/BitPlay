name: Build Testing AAB + APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Release AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-v6-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-v6-

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Cache Gradle
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v6-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-v6-

      - name: Cache Android NDK
        id: sdk-cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.1.12297006
            /usr/local/lib/android/sdk/build-tools/35.0.0
            /usr/local/lib/android/sdk/platforms/android-36
          key: android-sdk-v6-ndk27.1.12297006-bt35-api36

      - name: Install Android SDK components (if not cached)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "build-tools;35.0.0" \
            "platforms;android-36" \
            --sdk_root=$ANDROID_SDK_ROOT 2>/dev/null || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Get version info
        id: version
        run: |
          VERSION_CODE=$(grep versionCode android/app/build.gradle | tr -dc '0-9')
          VERSION_NAME=$(grep versionName android/app/build.gradle | grep -o '"[^"]*"' | tr -d '"')
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Set executable permission on gradlew
        run: chmod +x android/gradlew

      - name: Build release AAB + APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace --max-workers 4
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.1.12297006
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Delete old GitHub Releases (keep latest 2)
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const sorted = releases.data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = sorted.slice(2);
            for (const release of toDelete) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch(e) {}
            }

      - name: Create GitHub Release with APK + AAB
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const versionCode = '${{ steps.version.outputs.code }}';
            const versionName = '${{ steps.version.outputs.name }}';
            const tagName = `v${versionName}-build${versionCode}`;

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `BitplayPro v${versionName} (build ${versionCode})`,
              body: `Main branch build\n- versionCode: ${versionCode}\n- versionName: ${versionName}\n- Branch: main`,
              prerelease: true,
            });

            const apkPath = 'android/app/build/outputs/apk/release/app-release.apk';
            if (fs.existsSync(apkPath)) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: `bitplaypro-v${versionCode}-v${versionName}.apk`,
                data: fs.readFileSync(apkPath),
              });
            }

            const aabPath = 'android/app/build/outputs/bundle/release/app-release.aab';
            if (fs.existsSync(aabPath)) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: `bitplaypro-v${versionCode}-v${versionName}.aab`,
                data: fs.readFileSync(aabPath),
              });
            }

            console.log(`Release: ${release.data.html_url}`);
